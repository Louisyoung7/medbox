openapi: 3.0.3
info:
  title: medbox · 认证与用户（02a 试点 OpenAPI 版）
  description: |
    `medbox-spec/02a_认证与用户.md` 的机器可读版（试点）。

    > **口径来源**：本文件内容与 Markdown 分册保持一致；通用约定（统一响应 / 错误码 / 权限判定顺序）见根文档 `02_REST接口设计.md` §1。
    > 试点期 Markdown 与 YAML 并存，**以 Markdown 为准**；试点通过后反转为「以 YAML 为准、Markdown 只留判定规则表」。
    > 生成可读 WebUI：`npx @redocly/cli build-docs 02a-auth-users.yaml -o api-docs-02a.html`
  version: 1.0.0
  license:
    name: Proprietary（medbox 内部文档集，见 AGENTS.md）

servers:
  - url: http://{host}:8080/medbox/api/v1
    variables:
      host:
        default: 192.168.1.10
        description: 后端主机内网 IP（见 01 文档地址规划）

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 注册 / 登录 / 刷新（匿名访问）
  - name: users
    description: 当前用户、注销账号、监护关系

paths:
  /auth/register:
    post:
      operationId: authRegister
      tags: [auth]
      summary: 账号密码注册（手机号 + 密码 + 角色）
      description: |
        注册成功即登录，直接返回可用 token（与登录同构）。
        - `role` 只取 `ELDER` / `GUARDIAN`（见 06 §2.1）；监护关系不细分护理/医生角色，统一 `GUARDIAN`（01 §5）。
        - `username` / `name` 选填；监护人可用本接口**为老人代建账号**（`role=ELDER`）。
        - 密码服务端 BCrypt 加盐哈希存储。
        - 手机号重复等参数问题 → `40001`。
        - 本阶段不做微信登录；后续需要时再加 `POST /auth/login/wechat`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              phone: "13800001234"
              password: "******"
              role: GUARDIAN
              username: lisi
              name: 李四
      responses:
        '200':
          description: 注册成功（code=0，data 为 token 对象）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'

  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: 账号密码登录（手机号 / 用户名 + 密码）
      description: |
        - 登录失败统一返回 `40102`，不区分「账号不存在 / 密码错误」。
        - access token 有效期 2 小时（`expiresIn: 7200`），refresh token 7 天；refresh 采用轮换。
        - 该接口有登录防爆破限流：每客户端 IP 每 60 秒 10 次，超限返回 `42901`（HTTP 429）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              account: "13800001234"
              password: "******"
      responses:
        '200':
          description: 登录成功（code=0，data 为 token 对象）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: 账号或密码错误（40102）／ Token 过期（40101）
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/R'
              example:
                code: 40102
                message: 账号或密码错误
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [auth]
      summary: 刷新 Token（轮换）
      description: |
        轮换：响应中的新 `refreshToken` 顶替旧的，旧 refreshToken 立即作废。
        注销账号后调用 → `40101`（token 已 REVOKED）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 刷新成功（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthToken'
        '401':
          description: refreshToken 无效 / 已撤销（40101）
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/R'

  /users/me:
    get:
      operationId: getUserMe
      tags: [users]
      summary: 当前用户资料与角色【鉴权】
      description: |
        客户端只用 `userId` / `role` / `name` / `phone`（`role` 决定角色视图）；其余字段随后端实现追加，前端整份缓存不挑字段。
        响应中 null 字段按全局 `non_null` 规则省略。
      responses:
        '200':
          description: 当前用户资料（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /users/me/delete:
    post:
      operationId: deleteMe
      tags: [users]
      summary: 注销当前账号（软删除，密码二次确认）【鉴权】
      description: |
        路径挂在 `/users/me` 下（注销必须先登录）；动作型子路径 + POST。
        必须传密码，后端用 BCrypt 校验做二次确认。

        **接口特有规则（顺序即优先级；通用登录校验见 02 §1.3）**：
        | 顺序 | 条件 | 输出 |
        |---|---|---|
        | ① | password 缺失 / 空串 / 非字符串 | 40001 |
        | ② | 账号已是 DELETED | 40101（不回 40401，避免泄漏「账号曾存在」） |
        | ③ | 密码 BCrypt 校验不符 | 40102（不注销；与「账号不存在」同码） |
        | ④ | 全部通过 | code=0，执行软删除 |

        **软删除处理（按序执行，不级联删除业务数据）**：
        - `user`：status=DELETED、deleted_at=now()；phone / username 置 NULL 释放唯一键（同手机号可重新注册，分到新 user_id，旧数据不继承）
        - `refresh_token`：该用户全部生效行 → REVOKED
        - `guardian_relation`：该用户作为 elder_id 或 guardian_id 的全部 PENDING/ACTIVE 关系 → REVOKED（双向）
        - 业务数据（device / medicine / med_plan / med_record / env_sample / alarm / capture / llm_config 等）**全部保留不动**
        - access token 无状态不做黑名单：已签发 access 最长 2 小时仍可用（已知且接受的口径），靠 refresh 撤销兜底

        **边界用例**：注销后调 /auth/refresh → 40101；用旧密码登录 → 40102；2 小时内换设备重复提交 → 第二次 40101；
        老人注销 → 其 ACTIVE 监护关系 REVOKED；监护人注销 → 只撤销自己的关系。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMeRequest'
      responses:
        '200':
          description: 注销成功（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId:
                            type: string
                            example: u-1002
                          deletedAt:
                            type: string
                            format: date-time
                            description: ISO-8601 UTC
                            example: "2026-10-14T08:30:00Z"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          description: 未登录（40101）或账号已注销（40101，复用同码防枚举）
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/R'
        '403':
          description: 密码校验不符（40102 → HTTP 401 场景除外；通用越权 40301）
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/R'

  /users/{elderId}/profile:
    get:
      operationId: getElderProfile
      tags: [users]
      summary: 老人基础信息（监护人可见）【鉴权】
      description: |
        响应结构同 `GET /users/me`；null 字段按全局 non_null 规则省略。
        - **可见性**：老人本人，或与老人存在 ACTIVE 监护关系的监护人 —— 复用 `require(elderId, READ_GUARDIAN)`，判定顺序见 02 §1.3（① 40101 → ②③ 关系 → ④ 权限矩阵）。
        - **越权口径（防枚举）**：无关系 / REVOKED / 目标不是老人 → **40301**；关系 PENDING → **40302**。
      parameters:
        - $ref: './common.yaml#/components/parameters/ElderId'
      responses:
        '200':
          description: 老人资料（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GuardianDenied'

  /users/{elderId}/guardians:
    post:
      operationId: createGuardianRelation
      tags: [users]
      summary: 申请绑定监护关系（创建 PENDING）【鉴权·监护人发起】
      description: |
        监护人发起申请，创建 `PENDING` 关系；老人端确认后才置 `ACTIVE`，监护人才真正获得读写权限。
        无请求体（`Authorization: Bearer {监护人 token}` 即可）。

        **规则表（顺序即优先级）**：
        | 顺序 | 条件 | 输出 |
        |---|---|---|
        | ① | 当前角色 ≠ GUARDIAN | 40301 |
        | ② | 目标 elderId 不是真实老人 | 40301 |
        | ③ | 无既有关系 | code=0 建 PENDING |
        | ④ | 已有 PENDING / ACTIVE | 40901 |
        | ⑤ | 已有 REVOKED | code=0 改回 PENDING |
      parameters:
        - $ref: './common.yaml#/components/parameters/ElderId'
      responses:
        '200':
          description: 创建成功（PENDING，或 REVOKED 改回 PENDING）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GuardianRelation'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GuardianDenied'
        '409':
          description: 已存在 PENDING / ACTIVE 关系（40901）
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/R'

  /users/guardians/pending:
    get:
      operationId: listPendingGuardianRequests
      tags: [users]
      summary: 我待确认的监护请求列表【鉴权·老人端】
      description: |
        返回本人 `PENDING` 关系列表，join 带监护人姓名 + 手机，按 `createdAt` 升序。

        **规则表**：① 当前角色 ≠ ELDER → 40301；② 通过 → code=0 返回列表。
      responses:
        '200':
          description: 待确认列表（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PendingGuardianRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GuardianDenied'

  /users/guardians/{relationId}/accept:
    patch:
      operationId: acceptGuardianRelation
      tags: [users]
      summary: 确认监护请求（置 ACTIVE）【鉴权·老人端】
      description: |
        确认即置 `ACTIVE`（角色统一 GUARDIAN，无需请求体，传 `{}`）。

        **规则表（顺序即优先级）**：
        | 顺序 | 条件 | 输出 |
        |---|---|---|
        | ① | 当前角色 ≠ ELDER | 40301 |
        | ② | relationId 查不到 | 40301 |
        | ③ | relation.elderId ≠ 当前老人 | 40301 |
        | ④ | 关系已非 PENDING | 40901 |
        | ⑤ | 通过 | code=0 置 ACTIVE |
      parameters:
        - $ref: './common.yaml#/components/parameters/RelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example: {}
      responses:
        '200':
          description: 确认成功（ACTIVE）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GuardianRelation'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GuardianDenied'
        '409':
          description: 关系已非 PENDING（40901）
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/R'

  /users/guardians/{relationId}:
    delete:
      operationId: deleteGuardianRelation
      tags: [users]
      summary: 拒绝 / 解除监护关系【鉴权】
      description: |
        老人端拒绝、任一方解除；软删置 `REVOKED`，已是 REVOKED 则幂等跳过。无响应 data。

        **规则表（顺序即优先级）**：
        | 顺序 | 条件 | 输出 |
        |---|---|---|
        | ① | relationId 查不到 | 40301 |
        | ② | 当前用户既非关系里的老人、也非监护人 | 40301 |
        | ③ | 通过 | code=0 置 REVOKED |

        **边界用例**：申请后确认前监护人访问老人数据 → 40302；解除后再申请 → REVOKED 改回 PENDING；
        陌生人 accept/delete → 40301（防枚举）。
      parameters:
        - $ref: './common.yaml#/components/parameters/RelationId'
      responses:
        '200':
          description: 成功（code=0，data 缺省）
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/R'
              example:
                code: 0
                message: success
                traceId: 9f2c0f11a2b34c55d6e7f809a1b2c3d4
                timestamp: 1759474487
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GuardianDenied'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer {JWT}；设备端走 MQTT，不走此通道"

  schemas:
    RegisterRequest:
      type: object
      required: [phone, password, role]
      properties:
        phone:
          type: string
          example: "13800001234"
        password:
          type: string
          format: password
          example: "******"
        role:
          $ref: './common.yaml#/components/schemas/Role'
        username:
          type: string
          description: 选填
          example: lisi
        name:
          type: string
          description: 选填
          example: 李四

    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account:
          type: string
          description: 手机号或用户名
          example: "13800001234"
        password:
          type: string
          format: password
          example: "******"

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthToken:
      type: object
      required: [token, refreshToken, expiresIn]
      properties:
        token:
          type: string
          description: JWT access token，有效期 2 小时
          example: eyJhbGciOi...
        refreshToken:
          type: string
          description: 有效期 7 天；refresh 轮换（换新即作废旧的）
        expiresIn:
          type: integer
          description: access token 有效期（秒）
          example: 7200
        userId:
          type: string
          example: u-1001
          description: 注册 / 登录响应中返回
        role:
          $ref: './common.yaml#/components/schemas/Role'

    AuthTokenResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/R'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthToken'

    UserProfile:
      type: object
      description: 结构同 /users/me；null 字段按全局 non_null 规则省略。客户端只用 userId/role/name/phone，其余字段随后端追加。
      properties:
        userId:
          type: string
          example: u-1001
        role:
          $ref: './common.yaml#/components/schemas/Role'
        name:
          type: string
          example: 李四
        phone:
          type: string
          example: "13800001234"
        username:
          type: string
          example: lisi

    DeleteMeRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: BCrypt 二次确认，缺失/空串 → 40001
          example: "******"

    GuardianRelationStatus:
      type: string
      enum: [PENDING, ACTIVE, REVOKED]

    GuardianRelation:
      type: object
      properties:
        relationId:
          type: string
          example: r-1001
        elderId:
          type: string
          example: u-1001
        guardianId:
          type: string
          example: u-2001
        status:
          $ref: '#/components/schemas/GuardianRelationStatus'
        createdAt:
          type: string
          format: date-time
          example: "2026-10-22T08:00:00Z"

    PendingGuardianRequest:
      allOf:
        - $ref: '#/components/schemas/GuardianRelation'
        - type: object
          properties:
            guardianName:
              type: string
              example: 张三
            guardianPhone:
              type: string
              example: "13800001234"

  responses:
    GuardianDenied:
      description: |
        越权 / 关系未生效（HTTP 403）：
        - 无关系 / REVOKED / 目标不是老人 / 无权限 → **40301**（不区分「资源不存在」，防枚举）
        - 监护关系 PENDING 未确认 → **40302**
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/R'
          examples:
            forbidden:
              value:
                code: 40301
                message: 无权限
            pending:
              value:
                code: 40302
                message: 监护关系未生效

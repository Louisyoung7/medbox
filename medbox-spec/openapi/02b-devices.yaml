openapi: 3.0.3
info:
  title: medbox · 设备管理（02b OpenAPI 版）
  description: |
    `medbox-spec/02b_设备管理.md` 的机器可读版。通用约定见 `common.yaml`（口径来源 02 §1）。
    `deviceId` 指**药箱主控**（`device_type=MAIN`）；传感器/摄像头是其子设备（`parent_device_id` 关联），子设备无独立 MQTT 连接、在线状态由主控周期上报。
    可读 WebUI：`npx @redocly/cli build-docs 02b-devices.yaml -o api-docs-02b.html`；调试：`swagger-ui.html?spec=02b-devices.yaml`。
  version: 1.0.0

servers:
  - url: http://{host}:8080/medbox/api/v1
    variables:
      host:
        default: 192.168.1.10

security:
  - bearerAuth: []

tags:
  - name: devices
    description: 设备注册 / 查询 / 命令（命令实际经 MQTT 下行）
  - name: captures
    description: 设备抓拍与服药上报（摄像头经 HTTP 直连后端）

paths:
  /devices/register:
    post:
      operationId: registerDevice
      tags: [devices]
      summary: 药箱注册并绑定到老人【鉴权·仅 GUARDIAN】
      description: |
        监护人代老人登记设备，本期**注册即生效**（不做准入审核）。走 `require(elderId, WRITE_DEVICE)`，仅 GUARDIAN 具备该权限，老人本人（SELF）一律 40301；设备端不做无 Token 自注册。
        `onlineState` 恒为 OFFLINE——真正的在线要等设备连上 EMQX。

        **错误码口径（沿用 02 §1.2/§1.3，不新增码值）**：
        | 场景 | 结果 |
        |---|---|
        | 老人本人注册 | 40301（WRITE_DEVICE 仅 GUARDIAN） |
        | 监护关系 PENDING | 40302 |
        | 设备编号已登记（含子设备） | 40901（device_id 唯一，不静默覆盖、不改绑） |
        | 编号格式非法 / 子设备类型 MAIN / 时区非法 | 40001 |
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '200':
          description: 注册成功（注册即生效）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceWithSensors'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: 我监护的老人设备列表（含在线状态）【鉴权】
      description: 监护人侧可见老人由每台 MAIN 主控的 elderId 推导；ELDER 角色只见本人设备。
      responses:
        '200':
          description: 设备列表（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeviceWithSensors'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /devices/{deviceId}:
    get:
      operationId: getDeviceDetail
      tags: [devices]
      summary: 设备详情与最新遥测【鉴权】
      description: |
        `latestTelemetry`：读数在 env_sample 表（温湿度 / 光照合并最新非空读数），无上报时为 null。
        **查询他人设备或设备不存在 → 一律 40301**（不返回 40401，防设备编号枚举）；传子设备编号 → 40301（本接口只接受主控）。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 设备详情（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceDetail'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /devices/{deviceId}/status:
    get:
      operationId: getDeviceStatus
      tags: [devices]
      summary: 实时状态（在线/仓门）【鉴权】
      description: 仓门状态为刻意留空位（设备侧尚未上报，后续补字段）；越权 / 不存在 / 子设备编号 → 40301。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 设备状态（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceStatus'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /devices/{deviceId}/commands:
    post:
      operationId: sendDeviceCommand
      tags: [devices]
      summary: 下发控制命令（重启/校准），转 MQTT QoS1【鉴权·仅 GUARDIAN】
      description: |
        `cmd` 仅 `REBOOT` / `CALIBRATE`（声光 BUZZ / 开格 UNLOCK 由设备或小程序本地触发，后端不下发）。
        请求体不收 operator——操作人由服务端取鉴权用户落库留痕。

        **判定表（顺序即优先级）**：
        | 场景 | 结果 |
        |---|---|
        | 设备不存在 / 越权 / 传子设备编号 / 老人本人 | 40301（WRITE_DEVICE 仅 GUARDIAN；防编号枚举） |
        | 监护关系 PENDING | 40302 |
        | cmd 不在白名单 | 40001 |
        | 设备离线（online_state != ONLINE） | 40901 |
        | MQTT 未启用 | 50000（不落库） |
        | 受理成功 | 200，{commandId, state:"PENDING"}，异步等回执 |

        **终态流转**：受理落 PENDING → 转 MQTT down/command（QoS1）→ 设备回执 up/ack 或 5s 超时重发 3 次无回执 → 翻 SUCCESS/FAILED（迟到/重复回执幂等）。发布当场抛异常 → 行置 FAILED + 50000。每次下发写 PENDING + 终态两条 COMMAND 事件；无命令查询接口、无 WS 帧——前端刷 `GET /devices/{id}/events` 观察终态。该接口限流：按 deviceId 每 60s 20 次（42901）。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: './common.yaml#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCommandRequest'
            example:
              cmd: REBOOT
              params: {}
      responses:
        '200':
          description: 受理成功（异步，state=PENDING）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceCommandAccepted'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /devices/{deviceId}/events:
    get:
      operationId: listDeviceEvents
      tags: [devices]
      summary: 设备事件流水【鉴权】
      description: |
        分页（page 从 1 起，不传默认 20；size 超上限静默取上限；<1 报 40001），按 created_at **倒序**。
        数据源 device_event 表，只写 REGISTERED / ONLINE / OFFLINE 三类（FAULT/COMMAND 由后续分支续写）；
        **在线状态只写「跃变」**（真变了才落流水，同时推 DEVICE_STATUS WS 帧）。
        越权 / 不存在 / 子设备编号 → 40301。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: 事件流水分页（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: './common.yaml#/components/schemas/PageResult'
                          - type: object
                            properties:
                              list:
                                type: array
                                items:
                                  $ref: '#/components/schemas/DeviceEvent'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /devices/{deviceId}/sensors:
    get:
      operationId: listDeviceSensors
      tags: [devices]
      summary: 该药箱下的传感器子设备列表【鉴权】
      description: 温湿度 / 光照 / 摄像头子设备，含各自在线状态（由主控周期上报）。越权 / 不存在 → 40301。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 传感器列表（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SensorDevice'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /devices/{deviceId}/captures:
    post:
      operationId: uploadCapture
      tags: [captures]
      summary: 设备上报「是否拿药」结论（multipart，设备 HMAC 鉴权，不走 JWT）【设备鉴权】
      description: |
        设备端侧判定该格是否被取走，上报**格号 `cellNo`（1/2/3）+ 取药结论 `takenResult`**（TAKEN 已取 / UNTAKEN 未取）；**仅 UNTAKEN 附带抓拍图片**，TAKEN 不上图。
        deviceId 填**摄像头子设备自己的 deviceId**，后端按 parent_device_id 反查所属药箱与老人。
        后端不运行图像识别；超时该格无上报由后端兜底判漏服（MISS）。**不接收药品、剂量**。

        **planId 非空时**：除落 capture 外，还按 07 §1 判定规则落一条 med_record（含 cell_no / taken_result），响应回带 recordId；
        planId 为空（如 MANUAL 留证）只落 capture。

        **上传侧鉴权（HMAC，不走 JWT）**：Header 携带
        - `X-Device-Id`：摄像头子设备自己的 deviceId，**必须与路径 deviceId 完全一致**（否则 40001）
        - `X-Device-Sign`：`HMAC_SHA256(secret, deviceId + timestamp)`，十六进制小写
        - `X-Timestamp`：Unix 秒，与服务器时钟差 ≤ 5 分钟（防重放）

        校验：签名错/超窗 → 40101；不做「只校验 X-Device-Id」的退化方案。

        **错误码**：
        | 场景 | code | HTTP |
        |---|---|---|
        | HMAC 签名错 / 时间戳超 ±5min / X-Timestamp 非法 | 40101 | 401 |
        | X-Device-Id ≠ 路径 deviceId / UNTAKEN 未带 file / reason 非法 / cellNo 缺失或越界 / 缺参 | 40001 | 400 |
        | 设备未注册或父设备缺失 | 40301 | 403 |
        | 文件落盘 IO 失败 | 50000 | 500 |

        **去重**：planId 非空时按 `planId + cellNo` 分组，再按 `|capturedAt − 已有 capturedAt| ≤ 60s` 判重，命中只保留第一张（返回既有 captureId/expireAt，本次文件流丢弃不落盘）；planId 为空不去重。
        **必带字段容错**：planId 非空时 cellNo 必带（缺失/越界 40001）；takenResult 缺失仍落库、taken_result 兜底 UNTAKEN，不报错不丢弃。
        **存储**：图片存本地目录不暴露路径；ext 由 Content-Type 推导（jpg/png/webp，兜底 jpg），不使用原始文件名。
      security: []
      parameters:
        - $ref: '#/components/parameters/CaptureDeviceId'
        - name: X-Device-Id
          in: header
          required: true
          description: 摄像头子设备自己的 deviceId，必须与路径 deviceId 一致
          schema: { type: string }
        - name: X-Device-Sign
          in: header
          required: true
          description: HMAC_SHA256(secret, deviceId + timestamp)，十六进制小写
          schema: { type: string }
        - name: X-Timestamp
          in: header
          required: true
          description: Unix 秒，与服务器时钟差绝对值 ≤ 5 分钟
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaptureUploadRequest'
      responses:
        '200':
          description: 上报成功（recordId 仅 planId 非空且判定核心成功时回带，否则 null）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CaptureUploadResult'
              example:
                code: 0
                data: { captureId: cap-1001, expireAt: "2026-11-03T00:04:00Z", recordId: mr-1001 }
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /captures:
    get:
      operationId: listCaptures
      tags: [captures]
      summary: 抓拍列表（仅元数据，不含文件流）【鉴权】
      description: |
        走 `READ_CAPTURE`（老人本人 + GUARDIAN）。分页上限 200（图片元数据体积小，比通用 100 放宽）。
        无关系 / 老人看他人 → 40301；PENDING → 40302。
      parameters:
        - name: elderId
          in: query
          required: true
          schema: { type: string }
        - name: reason
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CaptureReason'
        - name: from
          in: query
          required: false
          description: capturedAt 起始（ISO-8601 UTC）
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - $ref: './common.yaml#/components/parameters/Page'
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 20, maximum: 200 }
      responses:
        '200':
          description: 抓拍元数据分页（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: './common.yaml#/components/schemas/PageResult'
                          - type: object
                            properties:
                              list:
                                type: array
                                items:
                                  $ref: '#/components/schemas/CaptureResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /captures/{captureId}:
    get:
      operationId: getCaptureDetail
      tags: [captures]
      summary: 抓拍详情【鉴权】
      description: 走 READ_CAPTURE。fileToken 每次取详情/列表重新签发（5 分钟有效），仅带图记录（UNTAKEN）签发，无图（TAKEN）为 null。captureId 不存在 → 40401。
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      responses:
        '200':
          description: 抓拍元数据（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CaptureResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    delete:
      operationId: deleteCapture
      tags: [captures]
      summary: 手动提前删除【鉴权·仅 GUARDIAN】
      description: |
        走 WRITE_CAPTURE（仅 GUARDIAN，老人本人 / 非 GUARDIAN 一律 40301）；GUARDIAN 但 PENDING → 40302。
        删库行 + 尽力删磁盘文件（文件已被清理任务清掉也不算失败）；captureId 不存在 / 已被清理 → 40401。
      parameters:
        - $ref: '#/components/parameters/CaptureId'
        - $ref: './common.yaml#/components/parameters/XRequestId'
      responses:
        '200':
          description: 删除成功（code=0，data 缺省）
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/R'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /captures/{captureId}/file:
    get:
      operationId: getCaptureFile
      tags: [captures]
      summary: 读取图片流（供小程序 <image src> 使用）【鉴权·query token】
      description: |
        **直接返回二进制**（Content-Type 为图片、Cache-Control: no-store），**不走统一响应体包裹**。
        仅带图记录（UNTAKEN）有图可取；无图记录（TAKEN）返回 40401。
        首次读取自动写 viewed_at 并按「查看后过期公式」重算 expire_at（expire_at = MIN(captured_at + 30 天, viewed_at + 7 天)；查看只提前不延长）。

        **为什么用 query 传 token**：小程序 <image src> 无法携带自定义 Header，故用后端签发的短期 fileToken（5 分钟有效）；不要把长期 JWT 放 URL。
        **错误码**：token 缺失/非法/与路径不符 → 40001；token 签名无效/过期 → 40101；不存在/已清理 → 40401；监护关系不符（二次复核）→ 40301/40302。
      parameters:
        - $ref: '#/components/parameters/CaptureId'
        - name: token
          in: query
          required: true
          description: 后端签发的短期 fileToken（5 分钟有效）
          schema: { type: string }
      responses:
        '200':
          description: 图片二进制流（不走 R<T> 包装）
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer {JWT}"
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: 药箱主控 deviceId（device_type=MAIN；子设备编号 → 40301）
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{4,64}$'
        example: BOXA-DEBUG-01
    CaptureDeviceId:
      name: deviceId
      in: path
      required: true
      description: 摄像头子设备自己的 deviceId（后端按 parent_device_id 反查所属药箱与老人）
      schema:
        type: string
        example: BOXA-DEBUG-01-S-CAM01
    CaptureId:
      name: captureId
      in: path
      required: true
      schema:
        type: string
        example: cap-1001

  schemas:
    DeviceType:
      type: string
      enum: [MAIN, TEMP_HUMI, LIGHT, CAMERA]
      description: 设备类型（06 §2.3）；注册接口的 sensors[].deviceType 只允许 TEMP_HUMI/LIGHT/CAMERA，填 MAIN 报 40001

    OnlineState:
      type: string
      enum: [ONLINE, OFFLINE]

    SensorRef:
      type: object
      properties:
        deviceId:
          type: string
          example: BOXA-DEBUG-01-S-TH01
        deviceType:
          type: string
          enum: [TEMP_HUMI, LIGHT, CAMERA]
          example: TEMP_HUMI

    RegisterDeviceRequest:
      type: object
      required: [deviceId, elderId]
      properties:
        deviceId:
          type: string
          description: 药箱主控编号，同时是 MQTT 的 clientId；4~64 位字母、数字、下划线或短横线
          pattern: '^[A-Za-z0-9_-]{4,64}$'
          example: BOXA-DEBUG-01
        elderId:
          type: string
          example: u-1001
        productKey:
          type: string
          description: Topic 第 2 层；留空取 medbox.device.default-product-key
          example: medbox-box
        timezone:
          type: string
          description: 设备本地时区（服药计划按此换算）；留空取 Asia/Shanghai，非法 → 40001
          example: Asia/Shanghai
        sensors:
          type: array
          description: 传感器子设备随主控一起登记，无需单独注册
          items:
            $ref: '#/components/schemas/SensorRef'

    Device:
      type: object
      properties:
        deviceId:
          type: string
          example: BOXA-DEBUG-01
        deviceType:
          $ref: '#/components/schemas/DeviceType'
        elderId:
          type: string
          example: u-1001
        productKey:
          type: string
          example: medbox-box
        timezone:
          type: string
          example: Asia/Shanghai
        onlineState:
          $ref: '#/components/schemas/OnlineState'
        registeredAt:
          type: string
          format: date-time
          example: "2026-10-13T01:00:00Z"

    DeviceWithSensors:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            sensors:
              type: array
              items:
                $ref: '#/components/schemas/SensorRef'

    DeviceDetail:
      allOf:
        - $ref: '#/components/schemas/DeviceWithSensors'
        - type: object
          properties:
            latestTelemetry:
              allOf:
                - $ref: '#/components/schemas/EnvRealtime'
                - type: object
                  nullable: true
                  description: 最新遥测（温湿度/光照合并最新非空读数），无上报时 null

    DeviceStatus:
      type: object
      properties:
        onlineState:
          $ref: '#/components/schemas/OnlineState'
        # 仓门状态：刻意留空位（设备侧尚未上报，后续补字段）

    DeviceCommandRequest:
      type: object
      required: [cmd]
      properties:
        cmd:
          type: string
          enum: [REBOOT, CALIBRATE]
          description: 声光 BUZZ / 开格 UNLOCK 由设备或小程序本地触发，后端不下发
        params:
          type: object
          additionalProperties: true
          description: 可选参数 Map（如 REBOOT 的 durationSec）
          example: {}

    DeviceCommandAccepted:
      type: object
      properties:
        commandId:
          type: string
          example: c-7f21
        state:
          type: string
          enum: [PENDING]
          description: 异步受理；终态（SUCCESS/FAILED）经 GET /devices/{id}/events 的 COMMAND 事件观察

    DeviceEventType:
      type: string
      enum: [REGISTERED, ONLINE, OFFLINE, FAULT, COMMAND]

    DeviceEvent:
      type: object
      properties:
        eventId:
          type: string
        deviceId:
          type: string
        type:
          $ref: '#/components/schemas/DeviceEventType'
        detail:
          type: string
          description: COMMAND 事件为 JSON {"commandId","cmd","state"[,"reason"]}（06 §2.16/2.17）
        createdAt:
          type: string
          format: date-time

    SensorDevice:
      allOf:
        - $ref: '#/components/schemas/SensorRef'
        - type: object
          properties:
            parentDeviceId:
              type: string
              description: 所属药箱主控（parent_device_id）
            onlineState:
              description: 子设备无独立 MQTT 连接，状态由主控周期上报（03 §3 up/sensor/heartbeat）
              allOf:
                - $ref: '#/components/schemas/OnlineState'

    CaptureReason:
      type: string
      enum: [NORMAL, MANUAL]
      description: NORMAL 正常服药上报 / MANUAL 监护人主动留证（LOW_CONFIDENCE 已弃用）

    TakenResult:
      type: string
      enum: [TAKEN, UNTAKEN]
      description: 设备端侧二值取药结论（无置信度、无第三态）

    CaptureUploadRequest:
      type: object
      required: []
      properties:
        file:
          type: string
          format: binary
          description: 图片二进制；仅 UNTAKEN 携带，TAKEN 不上传
        reason:
          description: 可空（MANUAL 留证可不带）
          allOf:
            - $ref: '#/components/schemas/CaptureReason'
        planId:
          type: string
          nullable: true
          description: 非空时才触发 60s 去重，且触发生成 med_record
        cellNo:
          type: integer
          nullable: true
          enum: [1, 2, 3]
          description: 格号 1/2/3（固件固定对应早/中/晚）；planId 非空时必带，MANUAL 留证可空
        takenResult:
          description: 可空；planId 非空时核心必带，缺失兜底置 UNTAKEN（容错不报错）；MANUAL 可不带
          allOf:
            - $ref: '#/components/schemas/TakenResult'
        capturedAt:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 UTC，缺省取服务器当前 UTC

    CaptureUploadResult:
      type: object
      properties:
        captureId:
          type: string
          example: cap-1001
        expireAt:
          type: string
          format: date-time
          description: TAKEN 无图记录按固定期（captured_at + 30 天，天数可配）
        recordId:
          type: string
          nullable: true
          description: planId 非空且判定核心成功时回带，否则 null

    CaptureResponse:
      type: object
      properties:
        captureId:
          type: string
          example: cap-1001
        deviceId:
          type: string
          example: BOXA-DEBUG-01-S-CAM01
        elderId:
          type: string
          example: u-1001
        planId:
          type: string
          nullable: true
          example: p-3301
        cellNo:
          type: integer
          nullable: true
          enum: [1, 2, 3]
          description: 格号 1/2/3
          example: 1
        reason:
          $ref: '#/components/schemas/CaptureReason'
        mime:
          type: string
          example: image/jpeg
        sizeBytes:
          type: integer
          example: 48213
        takenResult:
          description: 可空
          allOf:
            - $ref: '#/components/schemas/TakenResult'
        capturedAt:
          type: string
          format: date-time
          example: "2026-10-04T00:04:00Z"
        viewedAt:
          type: string
          format: date-time
          nullable: true
          description: 仅带图记录有值，未读为 null
        expireAt:
          type: string
          format: date-time
          description: 带图：MIN(captured_at+30 天, viewed_at+7 天)；无图：captured_at+30 天
        fileToken:
          type: string
          nullable: true
          description: 仅带图记录（UNTAKEN）签发，5 分钟有效，供 <image src> 拼接 /file?token=

    EnvRealtime:
      type: object
      description: 温湿度与光照合并读数（某传感器无数据则该字段 null）
      properties:
        temperature:
          type: number
          nullable: true
        humidity:
          type: number
          nullable: true
        lux:
          type: number
          nullable: true
        sampleTime:
          type: string
          format: date-time
          description: 取温湿度行与光照行中较新者

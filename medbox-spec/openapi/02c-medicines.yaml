openapi: 3.0.3
info:
  title: medbox · 药品档案（02c OpenAPI 版）
  description: |
    `medbox-spec/02c_药品档案.md` 的机器可读版。通用约定见 `common.yaml`。
    药品档案是**纯手工记录**：仅记录"有哪些药"及其文字信息，**不记录数量与日期、不与药箱设备关联**（06 §2.4）。
  version: 1.0.0

servers:
  - url: http://{host}:8080/medbox/api/v1
    variables:
      host: { default: 192.168.1.10 }

security:
  - bearerAuth: []

tags:
  - name: medicines
    description: 药品档案（公共字典 + 私有药品）

paths:
  /medicines:
    post:
      operationId: upsertMedicine
      tags: [medicines]
      summary: 新建/更新药品档案【鉴权·WRITE_MEDICINE（仅 GUARDIAN）】
      description: |
        更新时请求体带 medicineId，创建不带（由后端生成）；ownerElderId **不传即公共字典**，传某老人 userId 即其私有药品。
        可见范围 = 公共药品（ownerElderId 为空）+ 我监护老人的私有药品（服务端按 visibleElderIds() 行级过滤）。
        含禁忌、储存条件等字段（详见 06 §2.4）。
      parameters:
        - $ref: './common.yaml#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicineUpsertRequest'
      responses:
        '200':
          description: 新建/更新成功（code=0，data 为药品详情）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Medicine'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
    get:
      operationId: listMedicines
      tags: [medicines]
      summary: 药品字典 / 我的药品列表（分页、搜索）【鉴权】
      description: 可见范围 = 公共药品 + 我监护老人的私有药品（行级过滤）；分页按通用约定 page/size、返回 total。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 按名称/规格搜索
          schema: { type: string }
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: 药品分页列表（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: './common.yaml#/components/schemas/PageResult'
                          - type: object
                            properties:
                              list:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Medicine'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /medicines/{medicineId}:
    get:
      operationId: getMedicine
      tags: [medicines]
      summary: 药品详情【鉴权】
      parameters:
        - $ref: '#/components/parameters/MedicineId'
      responses:
        '200':
          description: 药品详情（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Medicine'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
    delete:
      operationId: deleteMedicine
      tags: [medicines]
      summary: 删除药品档案【鉴权·WRITE_MEDICINE（仅 GUARDIAN）】
      description: '药品档案无任何业务引用（计划 / 记录不关联药品），删除直接成功。'
      parameters:
        - $ref: '#/components/parameters/MedicineId'
        - $ref: './common.yaml#/components/parameters/XRequestId'
      responses:
        '200':
          description: 删除成功（code=0）
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/R'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer {JWT}"
  parameters:
    MedicineId:
      name: medicineId
      in: path
      required: true
      schema:
        type: string
        example: m-205

  schemas:
    Medicine:
      type: object
      description: 字段以最终实现为准（06 §2.4）；含禁忌、储存条件等
      properties:
        medicineId:
          type: string
          example: m-205
        name:
          type: string
          example: 阿莫西林胶囊
        specification:
          type: string
          nullable: true
          example: 0.25g*24粒
        unit:
          type: string
          nullable: true
          example: 粒
        ownerElderId:
          type: string
          nullable: true
          description: null=公共字典；非 null=该老人私有药品
        createdAt:
          type: string
          format: date-time

    MedicineUpsertRequest:
      type: object
      required: [name]
      properties:
        medicineId:
          type: string
          description: 更新时必带；创建不传（后端生成）
        name:
          type: string
        specification:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        ownerElderId:
          type: string
          nullable: true
          description: 不传即公共字典；传某老人 userId 即其私有药品
        # 禁忌 / 储存条件等字段见 06 §2.4，随后端实现追加

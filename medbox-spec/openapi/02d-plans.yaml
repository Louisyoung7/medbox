openapi: 3.0.3
info:
  title: medbox · 服药计划与提醒（02d OpenAPI 版）
  description: |
    `medbox-spec/02d_服药计划与提醒.md` 的机器可读版。通用约定见 `common.yaml`。
    计划保存后，后端将提醒规则转成设备可执行的定时任务并经 MQTT 下行同步；提醒触发以设备本地为准，云端做兜底与统计。

    **两处口径**：
    1. `slots[].time` 为**设备本地墙钟时间**（时区取 device.timezone，默认 Asia/Shanghai），**不是 UTC**——是 02 §1 通用 UTC 口径的例外；
    2. 漏服容忍时长优先级：`missAlarmAfterMin`（计划级）> `alarm_setting.missTolerateMin`（老人级）> 系统默认 15 分钟，计划级留空即沿用上一级。

    **一老人一计划、三个固定格位**：药箱格号 1/2/3 由固件固定对应早/中/晚，计划只用 `slots` 描述「几点开几号格」，**不含药品信息**；同一 `elderId` 至多一个计划（重复创建 40901）。漏服判定以「该格该槽是否有服药记录」为准。
  version: 1.0.0

servers:
  - url: http://{host}:8080/medbox/api/v1
    variables:
      host: { default: 192.168.1.10 }

security:
  - bearerAuth: []

tags:
  - name: plans
    description: 服药计划 CRUD / 启停 / 时间线

paths:
  /plans:
    post:
      operationId: createPlan
      tags: [plans]
      summary: 创建服药计划【鉴权·WRITE_PLAN（仅 GUARDIAN）】
      description: |
        - slots：1~3 项，每项 `{cellNo, time}`；`cellNo` 取 1/2/3 且不重复；`time` 为 `HH:mm`（设备本地墙钟，不做时区换算）；回显按 cellNo 升序；
        - **计划不含药品**：不校验药品档案；
        - **一老人一计划**：同一 elderId 已存在计划 → 40901；
        - syncState 创建后初始值恒为 **PENDING**，真正的 SYNCED_TO_DEVICE / SYNC_FAILED 由设备同步写入（前端须兼容 PENDING 展示为「待同步」）；
        - 设备同步映射：创建/修改/启用 → down/schedule op=UPSERT（载荷为 slots）；删除/停用 → op=DELETE；回执 ack 后翻 SYNCED_TO_DEVICE，FAILED/超时 3 次翻 SYNC_FAILED；无 MAIN 设备 / MQTT 禁用安全降级保持 PENDING。
      parameters:
        - $ref: './common.yaml#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanUpsertRequest'
            example:
              elderId: u-1001
              name: 日常服药
              slots:
                - { cellNo: 1, time: "08:00" }
                - { cellNo: 2, time: "12:30" }
                - { cellNo: 3, time: "18:00" }
              repeatRule: DAILY
              missAlarmAfterMin: 15
              alarmRule: { miss: true, env: true }
      responses:
        '200':
          description: 创建成功（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Plan'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

    get:
      operationId: listPlans
      tags: [plans]
      summary: 按老人查询计划列表【鉴权·READ_PLAN（全角色）】
      description: 一老人一计划，返回 0 或 1 条；elderId：老人端取自身、监护人端从可见设备归纳。
      parameters:
        - name: elderId
          in: query
          required: true
          schema: { type: string }
          example: u-1001
      responses:
        '200':
          description: 计划列表（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Plan'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /plans/{planId}:
    get:
      operationId: getPlan
      tags: [plans]
      summary: 计划详情（含 slots）【鉴权·READ_PLAN（全角色）】
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: 计划详情（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Plan'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    put:
      operationId: updatePlan
      tags: [plans]
      summary: 修改计划【鉴权·WRITE_PLAN（仅 GUARDIAN）】
      description: '整体覆盖：slots / 周期 / 报警规则全量提交；未提交的格号即停用。'
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: './common.yaml#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanUpsertRequest'
      responses:
        '200':
          description: 修改成功（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Plan'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

    delete:
      operationId: deletePlan
      tags: [plans]
      summary: 删除计划【鉴权·WRITE_PLAN（仅 GUARDIAN）】
      description: 删除 → down/schedule op=DELETE。
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: './common.yaml#/components/parameters/XRequestId'
      responses:
        '200':
          description: 删除成功（code=0）
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/R'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /plans/{planId}/status:
    patch:
      operationId: changePlanStatus
      tags: [plans]
      summary: 启用/停用计划【鉴权·WRITE_PLAN（仅 GUARDIAN）】
      description: '请求体 {status: ENABLED|DISABLED}；启用 → op=UPSERT、停用 → op=DELETE。'
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: './common.yaml#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ENABLED, DISABLED]
      responses:
        '200':
          description: 启停成功（code=0，data 为计划）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Plan'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /plans/{planId}/next-doses:
    get:
      operationId: getNextDoses
      tags: [plans]
      summary: 未来待服药时间线（按槽展开，含格号）【鉴权·READ_PLAN（全角色）】
      description: |
        **后端接口已落地**，前端只消费 scheduledTimeLocal（不自行换算时区、不做按次展开）。
        - `days` 默认 7、上限 60（越界由后端 40001）；本期仅 `DAILY`；
        - 停用计划返回空；按 device.timezone 换算 scheduledTimeUtc / scheduledTimeLocal；
        - GET 无 X-Request-Id。
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: days
          in: query
          required: false
          description: 展开天数，默认 7、上限 60
          schema: { type: integer, minimum: 1, maximum: 60, default: 7 }
      responses:
        '200':
          description: 未来服药时间线（code=0；响应外壳兼容 {doses:[...]} 与裸数组）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NextDosesResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer {JWT}"
  parameters:
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        example: p-3301

  schemas:
    RepeatRule:
      type: string
      enum: [DAILY]
      description: 本期仅 DAILY

    PlanSyncState:
      type: string
      enum: [PENDING, SYNCED_TO_DEVICE, SYNC_FAILED]
      description: 仅回显；创建后恒 PENDING，前端须兼容展示为「待同步」，未知值原样展示、无字段不渲染

    PlanSlot:
      type: object
      required: [cellNo, time]
      properties:
        cellNo:
          type: integer
          enum: [1, 2, 3]
          description: 格号；固件固定对应早 / 中 / 晚，后端不关心格内药品
          example: 1
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: 设备本地墙钟 HH:mm（非 UTC）
          example: "08:00"

    PlanUpsertRequest:
      type: object
      required: [elderId, slots]
      properties:
        elderId:
          type: string
          example: u-1001
        name:
          type: string
          nullable: true
          description: 方案名（选填）
          example: 日常服药
        slots:
          type: array
          minItems: 1
          maxItems: 3
          description: 格号 → 开格时间；cellNo 不重复；缺失格号表示该格不排程；PUT 整体覆盖
          items:
            $ref: '#/components/schemas/PlanSlot'
        repeatRule:
          $ref: '#/components/schemas/RepeatRule'
        missAlarmAfterMin:
          type: integer
          nullable: true
          description: 漏服容忍分钟（计划级，优先级最高）；留空沿用老人级 > 系统默认 15
          example: 15
        alarmRule:
          type: object
          nullable: true
          properties:
            miss: { type: boolean, example: true }
            env: { type: boolean, example: true }

    Plan:
      type: object
      properties:
        planId:
          type: string
          example: p-3301
        elderId:
          type: string
        name:
          type: string
          nullable: true
        slots:
          type: array
          items:
            $ref: '#/components/schemas/PlanSlot'
        repeatRule:
          $ref: '#/components/schemas/RepeatRule'
        missAlarmAfterMin:
          type: integer
          nullable: true
        alarmRule:
          type: object
          nullable: true
          properties:
            miss: { type: boolean }
            env: { type: boolean }
        status:
          type: string
          enum: [ENABLED, DISABLED]
        syncState:
          $ref: '#/components/schemas/PlanSyncState'

    NextDose:
      type: object
      properties:
        cellNo:
          type: integer
          enum: [1, 2, 3]
          description: 格号（1/2/3）
        scheduledTimeUtc:
          type: string
          format: date-time
          description: 按 device.timezone 换算的 UTC 时刻
        scheduledTimeLocal:
          type: string
          description: 设备本地墙钟（前端直接消费，不自行换算时区）
          example: "2026-11-08 08:00"

    NextDosesResponse:
      type: object
      properties:
        doses:
          type: array
          description: 计划停用返回空；外壳兼容 {doses:[...]} 与裸数组（前端 parseNextDoses 一处收敛）
          items:
            $ref: '#/components/schemas/NextDose'

openapi: 3.0.3
info:
  title: medbox · 环境监测（02g OpenAPI 版）
  description: |
    `medbox-spec/02g_环境监测.md` 的机器可读版。通用约定见 `common.yaml`。
    环境阈值按老人统一配置（不按药品单独设置），走 `PUT /alarm-settings?elderId=` 的 envThreshold 字段（见 02f）。
    本模块**只落库与查询**、不告警、不推 WS（超标告警归环境告警分支）。
  version: 1.0.0

servers:
  - url: http://{host}:8080/medbox/api/v1
    variables:
      host: { default: 192.168.1.10 }

security:
  - bearerAuth: []

tags:
  - name: env
    description: 温湿光实时读数 / 历史曲线

paths:
  /env/realtime:
    get:
      operationId: getEnvRealtime
      tags: [env]
      summary: 最新温湿光读数（按传感器合并）【鉴权·READ_ENV】
      description: |
        权限：requireDevice(deviceId, READ_ENV)，越权 / 设备查不到一律 40301（与设备类接口同口径，防设备编号枚举）。
        温湿度传感器与光照传感器分两条 env_sample 入库，本接口**合并两者最新非空读数**；
        某传感器无数据则该字段 null；sampleTime 取温湿度行与光照行中较新者。
      parameters:
        - name: deviceId
          in: query
          required: true
          description: 药箱主控
          schema: { type: string }
          example: BOXA-DEBUG-01
        - name: sensorId
          in: query
          required: false
          description: 按传感器查
          schema: { type: string }
      responses:
        '200':
          description: 实时读数（code=0；无数据字段为 null）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: './02b-devices.yaml#/components/schemas/EnvRealtime'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /env/history:
    get:
      operationId: getEnvHistory
      tags: [env]
      summary: 历史曲线（小程序图表）【鉴权·READ_ENV】
      description: |
        - from / to **必填**（ISO-8601，含端点）；interval 可选（分钟，1~1440，分桶 avg() 聚合；缺省返回原始有序点）；
        - 按 sensorId 查询时只筛该传感器 device_id，否则按药箱 gateway_device_id 筛其下全部传感器；
        - 边界校验（不满足 → 40001）：from/to 缺省；from > to；interval 越界（1~1440）；**时间跨度 > 30 天**；
        - 原始模式下单行只带一类数值、其余为 null（温湿度与光照来自不同传感器、上报时刻不同）；分桶模式按桶 avg() 聚合（avg 天然忽略 null）。
      parameters:
        - name: deviceId
          in: query
          required: true
          schema: { type: string }
        - name: sensorId
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: interval
          in: query
          required: false
          description: 分桶分钟数（1~1440，avg() 聚合）；缺省返回原始有序点
          schema: { type: integer, minimum: 1, maximum: 1440 }
      responses:
        '200':
          description: 历史曲线（code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EnvHistoryResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer {JWT}"
  schemas:
    EnvPoint:
      type: object
      description: 原始模式下单行只带一类数值、其余 null；分桶模式按桶 avg() 聚合
      properties:
        sampleTime:
          type: string
          format: date-time
        temperature:
          type: number
          nullable: true
        humidity:
          type: number
          nullable: true
        lux:
          type: number
          nullable: true

    EnvHistoryResponse:
      type: object
      properties:
        points:
          type: array
          description: 外壳兼容 {points:[...]} 与裸数组（前端 parseEnvHistory 一处收敛）
          items:
            $ref: '#/components/schemas/EnvPoint'

# medbox-server/src/main/resources/application.yml
#
# 入库版配置：不含任何因人而异的内网 IP。
#   - PostgreSQL / EMQX / Ollama / OCR 都在本机，一律写 localhost（各人一套，见文档 01 的 4.5）
#   - 唯一因人而异的 medbox.host 走 ${MEDBOX_HOST} 占位
#   - 本地覆盖用 src/main/resources/application-local.yml（不入库，模板见 application-local.yml.example）
#     或直接在 IDE Run Configuration 里配环境变量 MEDBOX_HOST=192.168.1.x
#
# 参考：medbox-spec/01 的 4.1.1

spring:
  application:
    name: medbox-server
  jackson:
    time-zone: UTC                  # 除服药计划 times（设备本地墙钟）外，时间一律 UTC（见文档 01）
    default-property-inclusion: non_null   # 值为 null 的字段不输出（如失败响应的 data）
  mvc:
    throw-exception-if-no-handler-found: true  # 无匹配路径抛 NoHandlerFoundException → 全局异常处理返回 40401
  web:
    resources:
      add-mappings: false           # 不做静态资源映射，未命中路径才能落到上面的异常处理（统一响应结构）
  datasource:
    # 本机 Postgres（Docker 映射），一律走 localhost，不写内网 IP（见文档 01 的 4.1.1 / 4.5）
    # 库名与账号因人而异时用环境变量覆盖，或写在不入库的 application-local.yml 里
    url: ${MEDBOX_DB_URL:jdbc:postgresql://localhost:5432/medbox}
    username: ${MEDBOX_DB_USERNAME:myuser}
    password: ${MEDBOX_DB_PASSWORD:mypassword}
  flyway:
    enabled: true                        # 启动时自动执行 db/migration 下的脚本，空库一键初始化
    locations: classpath:db/migration
    clean-disabled: true                 # 禁止 clean，避免误清库
    validate-on-migrate: true            # 已执行脚本被改动则启动失败
  ai:
    # 本分支只接本地 Embedding（bge-m3）与 pgvector 向量库；Chat 后续由 feat/ai-chat 按需动态构造，这里先关掉自动装配
    model:
      chat: none
    ollama:
      base-url: http://localhost:11434   # 本地 Embedding（bge-m3），不出网、无需 Key
      embedding:
        model: bge-m3
    vectorstore:
      pgvector:
        dimensions: 1024                 # 与 bge-m3 一致，换模型须重建向量
        index-type: HNSW                 # 默认 HNSW（多层图索引）
        distance-type: COSINE_DISTANCE   # 默认余弦距离
        initialize-schema: false         # 默认不自动建表：缺 PG 也不阻塞启动；仅 ai-local profile 开 true 供集成测试

server:
  port: 8080
  address: 0.0.0.0              # 监听所有网卡；Spring Boot 默认即如此（见文档 01 的 4.1.2）
  servlet:
    context-path: /medbox      # 小程序 BASE_URL=.../medbox/api/v1、WS_URL=.../medbox/ws（见文档 02 / 04）

management:
  endpoints:
    web:
      exposure:
        include: health,info   # 健康检查：GET /medbox/actuator/health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%thread] [trace=%X{traceId:-}] %logger{40} - %msg%n"
    # 日志里带 traceId，与响应体 R.traceId / 响应头 X-Trace-Id 对齐（见文档 02 的 1.1）

medbox:
  host: ${MEDBOX_HOST:192.168.1.10}   # 本机对外 IP；各人在不入库的本地文件里给自己的值
  ports:
    http: 8080
    ws: 8080
    mqtt: 1883                  # 对外暴露的 EMQX 端口（设备用）
  ocr:
    provider: local             # local=本机 RapidOCR 侧车服务；cloud=云端 OCR API（需 Key）
    endpoint: http://localhost:8000/ocr
  capture:
    dir: /var/medbox/captures     # 抓拍图片本地存储目录（需可写、留意磁盘配额）
    retention-days-unread: 30     # 未读最长保留天数
    retention-days-read: 7        # 已读后保留天数；expire_at = MIN(captured+30d, viewed+7d)

  # —— 设备注册与事件流水（feat/device-core，见文档 02 第 4 章 / 06 的 2.16）——
  device:
    default-product-key: medbox-box    # 注册请求没填 productKey 时的兜底值；它是 Topic 第 2 层，不能为空
    default-timezone: Asia/Shanghai    # 设备本地时区（服药时间按此换算，见文档 06 的 2.6.1）
    event-page-size: 20                # 事件流水默认每页条数
    event-max-page-size: 100           # 每页上限：防深分页拖垮数据库，也防客户端一次拉全量

  # —— 出站地址：后端作为“客户端”要连的对端 —— #
  # MQTT 接入（feat/backend-mqtt，见文档 03）：本机 EMQX，本期匿名连接（无用户名密码）
  mqtt:
    enabled: ${MEDBOX_MQTT_ENABLED:true} # 逃生开关：MQTT 相关 Bean 全部条件装配，false 时完全不连 broker
                                         # （CI / 未起 EMQX 时用它，避免 @SpringBootTest 启动失败）
    broker: tcp://localhost:1883    # EMQX 与后端同机，走 localhost，无内网 IP
    client-id: medbox-server-01     # 后端在 EMQX 里的 clientId（**本期匿名连接，无需用户名密码**）
    # username / password：本期不配置；将来关闭 EMQX 匿名时再补（见文档 03 第 1 章）
    topic-prefix: medbox            # Topic 一级前缀，完整形态 medbox/{productKey}/{deviceId}/up|down|status/...
    subscribe-qos: 1                # 订阅 QoS（上行里 telemetry/heartbeat 是 QoS0，订阅侧给 1 仍按发布方 QoS 投递）
    keep-alive-seconds: 60          # KeepAlive，与设备端一致（见文档 03 第 1 章）
    clean-session: true             # 干净会话；重连后在 connectComplete 回调里重新订阅，避免 session 状态不一致
    auto-reconnect: true            # Paho 自动重连
    connection-timeout-seconds: 10  # 单次连接超时；**连不上不阻塞应用启动**，只 WARN 并后台重试
    ack-timeout-ms: 5000            # 下行消息等待 up/ack 的超时（文档 03 第 1 章：超时重发，最多 3 次）
    max-attempts: 3                 # 含首次在内的总下发次数（1 次首发 + 2 次重发）
    retry-scan-interval-ms: 1000    # 待回执账本的扫描间隔（内存账本，重启丢失少量待确认消息）
    dedup-retention-days: 7         # mqtt_message 去重记录保留天数（过期记录由清理任务删除）
  # —— WebSocket 推送骨架（feat/backend-ws，见文档 04）——
  # 端点完整形态 ws://{medbox.host}:8080/medbox/ws?token=..&topics=elder:{elderId}&lastEventId=evt-9a1c
  ws:
    enabled: ${MEDBOX_WS_ENABLED:true}   # 逃生开关：false 时整个 ws 包不装配（CI / 排障用）
    endpoint: /ws                        # context-path /medbox 之后，即 /medbox/ws
    heartbeat-seconds: 30                # 客户端 ping 间隔（文档 04 第 1 章）
    idle-timeout-seconds: 90             # 服务端判僵死的空闲阈值（3 个心跳周期）
    idle-scan-interval-ms: 30000         # 空闲连接扫描间隔
    debug-endpoint-enabled: false        # 调试推送端点开关：**默认关**，本地联调才开（见 04 第 4 章）
    replay:
      max-events: 200                    # 每个主题最多保留的事件条数（文档 04 第 1 章）
      window-minutes: 10                 # 补推窗口：只保留最近 10 分钟的事件

  # —— 漏服判定与 MISS 告警（feat/miss-alarm，见文档 06 的 2.9 / 02 第 8 章）——
  alarm:
    miss:
      enabled: ${MEDBOX_ALARM_MISS_ENABLED:true}  # 逃生开关：false 时定时扫描整体不跑（CI / 排障用）
      scan-interval-ms: 60000                     # 扫描间隔（毫秒），每 60s 扫一次
      lookback-minutes: 1440                       # 回看窗口（分钟）= 24h，防服务重启后漏判又不至于扫太久
      skip-when-device-offline: true               # 主控离线时跳过该老人，避免"上报不了=漏服"误判

  ai:
    base-url: https://api.example.com/v1 # 公网大模型，属后端出网方向（唯一必须写死的外网地址）

  # —— 认证（feat/backend-auth，见文档 02 第 3 章）—— #
  jwt:
    # HS256 签名密钥：≥32 字节。**本地开发可用下面的默认值，正式/对外部署必须设 MEDBOX_JWT_SECRET 覆盖**
    secret: ${MEDBOX_JWT_SECRET:medbox-local-dev-secret-change-me-please}
    access-token-ttl-seconds: 7200      # access token 2 小时（expiresIn=7200）
    refresh-token-ttl-seconds: 604800   # refresh token 7 天，轮换制（换新即作废旧的）
  idempotency:
    ttl-hours: 24                       # X-Request-Id 幂等记录保留时长（目前只保护 POST /auth/register）

  # —— 联调辅助（feat/backend-devtools，见文档 02 的 1.4 / 03 第 5 章）——
  # 调试端点总开关：默认关闭；本地联调置 true 才装配 POST /api/v1/_debug/seed 与 /_debug/mqtt/publish
  devtools:
    enabled: false
    seed:
      guardian-phone: "13800001234"     # 与 02 §1.4 示例对齐
      guardian-password: "Dev@123456"   # 本地联调用明文，不进真实账号体系
      guardian-user-id: "u-1001"        # 与 02 §1.4 登录返回示例对齐
      elder-user-id: "e-1001"           # 与 02 §1.4 示例对齐
      device-id: "BOXA1001"             # 与 03 §5 示例对齐（MQTT clientId）
      product-key: medbox-box
      timezone: Asia/Shanghai

# 本地 AI 集成测试 profile（feat/backend-ai-infra）。
#
# 开发者在本地起好 Ollama（:11434，先 `ollama pull bge-m3`）与 RapidOCR 侧车（:8000）后，
# 另设环境变量 MEDBOX_AI_LOCAL_TEST=true 再运行 AiLocalIntegrationTest 即可启用。
# 该测试用 @DynamicPropertySource 把 CI 的 SPRING_FLYWAY_ENABLED=false 覆盖回 true，
# 并（连同本 profile）开启下方 pgvector 自动建表，从而跑通：embed→1024 维 / OCR→文字 / 向量写入+召回。
spring:
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true   # 自动建 vector_store 表（依赖 Flyway 先建好 vector 扩展）

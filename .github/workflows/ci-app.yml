name: CI · medbox-app

# 只关心客户端目录：改动 medbox-server/ 不会触发本工作流（同理见 ci-server.yml）
on:
  push:
    branches: [main]
    paths:
      - 'medbox-app/**'
      - 'medbox-spec/contracts/**'
      - '.github/workflows/ci-app.yml'
  pull_request:
    paths:
      - 'medbox-app/**'
      - 'medbox-spec/contracts/**'
      - '.github/workflows/ci-app.yml'
  workflow_dispatch:

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 H5 与 App 资源
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medbox-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: medbox-app/package-lock.json

      - name: 安装依赖（锁版本）
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: Mock 端到端
        run: npm run test:e2e

      - name: 契约场景（对 Mock）
        run: npm run test:contract:mock

      - name: 构建 H5
        run: npm run build:h5

      - name: 构建 App 资源
        run: npm run build:app-plus

      # 只是产物留存，供 HBuilderX 出 APK 时核对；CI 无法产出安装包
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-resources
          path: medbox-app/dist/build/app
          if-no-files-found: warn
